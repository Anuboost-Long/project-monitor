name: Build desktop apps

on:
 workflow_dispatch:
 push:
  tags:
   - "v*"

permissions:
 contents: write

jobs:
 build:
  name: Build ${{ matrix.name }}
  strategy:
   fail-fast: false
   matrix:
    include:
     - name: macOS
       os: macos-14
       config: electron-builder.mac.yml
     - name: Windows
       os: windows-latest
       config: electron-builder.win.yml
     - name: Linux
       os: ubuntu-22.04
       config: electron-builder.linux.yml

  runs-on: ${{ matrix.os }}

  steps:
   - name: Check out repository
     uses: actions/checkout@v4

   - name: Set up Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 22
      cache: npm

   - name: Install dependencies
     run: npm ci

   - name: Verify source
     run: npm run verify

   - name: Build application
     run: npm run build

   - name: Publish to this repository's releases
     run: npx electron-builder --config ${{ matrix.config }} --publish always
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
